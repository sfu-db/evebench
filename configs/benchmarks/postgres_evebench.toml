version = 1
name = "postgres_evebench"
dataset = "../../datasets/postgres/evebench/postgres.csv"
database = "../../data/evebench.sqlite"

timeout_ms = 30000
semantics = "bag"
seed = 1
strip_shared_order_by_limit = true
checkers = ["verieql", "qed", "sqlsolver", "spes", "parseval"]

max_workers = 5
max_tasks_per_worker = 25
progress_every = 10

[backends.verieql]

[backends.verieql.options]
bound_size = 2

[backends.sqlsolver]

[backends.spes]

[backends.spes.options]
strip_foreign_keys = true

[backends.qed]

[backends.qed.options]
strip_foreign_keys = true

[backends.parseval]


[backends.parseval.options]
# Use a dedicated disposable PostgreSQL database; ParSEval drops it after each case.
connection_string = "postgresql://postgres:postgres@14-postgres-1:5432/evebench_parseval"
# ParSEval 0.0.6 GenerationConfig defaults, pinned for reproducibility.
# `seed` is the shared benchmark seed above. `max_plan_depth` remains unlimited.
bootstrap_rows = 3
bootstrap_negatives = true
root_rows = 3
groups = 3
rows_per_group = 3
subquery_rows = 1
order_competitors = 1
max_rows_per_table = 128
max_total_rows = 512
max_solver_calls = 48
solver_timeout_ms = 1000
